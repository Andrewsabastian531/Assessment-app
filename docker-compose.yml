name: vedaai

# Host ports are deliberately off the defaults so they cannot collide with a
# native Postgres or Redis already installed on the machine.
services:
  # pgvector build required: the schema declares vector(768) columns.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vedaai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vedaai
      POSTGRES_PASSWORD: vedaai
      POSTGRES_DB: vedaai
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vedaai -d vedaai']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vedaai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for Cloudflare R2 locally; same S3 API, no credentials needed.
  minio:
    image: minio/minio:latest
    container_name: vedaai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vedaai
      MINIO_ROOT_PASSWORD: vedaai-secret
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket on first run.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vedaai vedaai-secret &&
      mc mb --ignore-existing local/vedaai-uploads &&
      mc anonymous set download local/vedaai-uploads &&
      echo 'bucket vedaai-uploads ready'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
