name: Keep API awake

# A free Render service sleeps after 15 minutes without inbound traffic, and
# the next visitor waits ~50s for it to wake. Worse, a grading job in flight
# stalls until something touches the service again. This pings the health
# endpoint often enough to stay under that window.
#
# Set an API_URL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables) to the Render URL, e.g. https://vedaai-api.onrender.com
# KEEPALIVE is accepted as an alias. Without either the job exits quietly
# rather than failing every ten minutes.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          # Either name works, and a trailing slash is tolerated.
          API_URL: ${{ vars.API_URL || vars.KEEPALIVE }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Set an API_URL repository variable to enable this."
            exit 0
          fi
          API_URL="${API_URL%/}"

          # A sleeping instance can take most of a minute to answer, so allow
          # for that before deciding the service is actually down.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            "$API_URL/api/v1/health" || echo 000)

          echo "GET $API_URL/api/v1/health -> $code"
          [ "$code" = "200" ] || { echo "::warning::API did not return 200"; exit 0; }
